<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personaje - Muvar</title>
</head>

<body
    style="margin:0; padding:10px; background-color:#1a120a; font-family:Georgia, serif; display:flex; justify-content:center; align-items:flex-start; overflow-x:hidden;">

    <!-- TARJETA PRINCIPAL -->
    <div
        style="width:100%; max-width:460px; background-color:#f2e8d5; background-image:radial-gradient(ellipse at 20% 30%, rgba(180,140,80,0.15) 0%, transparent 60%), radial-gradient(ellipse at 80% 70%, rgba(120,80,30,0.12) 0%, transparent 55%), url('data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'200\'><filter id=\'n\'><feTurbulence type=\'fractalNoise\' baseFrequency=\'0.75\' numOctaves=\'4\' stitchTiles=\'stitch\'/><feColorMatrix type=\'saturate\' values=\'0\'/></filter><rect width=\'200\' height=\'200\' filter=\'url(%23n)\' opacity=\'0.04\'/></svg>'); border-radius:4px; border:1px solid rgba(90,60,20,0.4); box-shadow:0 0 0 6px rgba(90,60,20,0.12), 0 8px 40px rgba(0,0,0,0.7), inset 0 0 40px rgba(120,80,20,0.18), inset 0 0 8px rgba(90,60,20,0.1); padding:28px 28px 22px 28px; box-sizing:border-box; position:relative; overflow:hidden;">

        <!-- ENCABEZADO -->
        <div style="text-align:center; margin-bottom:10px; position:relative; z-index:1;">
            <p
                style="margin:0 0 4px 0; font-size:9px; letter-spacing:3.5px; text-transform:uppercase; color:#7a1e1e; font-family:Georgia, serif; opacity:0.85;">
                Ficha de Personaje</p>
            <h1
                style="margin:0; font-size:26px; font-family:Georgia, serif; color:#2c1f0e; font-weight:bold; letter-spacing:1px; text-shadow:1px 1px 2px rgba(90,60,20,0.25);">
                Muvar</h1>
            <p style="margin:2px 0 0 0; font-size:13px; font-style:italic; color:#5a3c14;">"El Compañero Entusiasta"</p>
        </div>

        <!-- ORNAMENTO -->
        <div style="display:flex; align-items:center; gap:8px; margin:0 0 14px 0; position:relative; z-index:1;">
            <div style="flex:1; height:1px; background:linear-gradient(to right, transparent, rgba(90,60,20,0.5));"></div>
            <div style="width:7px; height:7px; background:rgba(90,60,20,0.5); transform:rotate(45deg); flex-shrink:0;"></div>
            <div style="flex:1; height:1px; background:linear-gradient(to left, transparent, rgba(90,60,20,0.5));"></div>
        </div>

        <!-- DATOS CLAVE -->
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0; position:relative; z-index:1;">
            <div style="padding:6px 8px 6px 4px; border-bottom:1px solid rgba(90,60,20,0.25);">
                <div style="font-size:8.5px; letter-spacing:1.5px; text-transform:uppercase; color:#7a1e1e;">Rol</div>
                <div style="font-size:12.5px; color:#2c1f0e;">Compañero / Pesca y Pesquisa</div>
            </div>

            <div style="padding:6px 4px 6px 8px; border-bottom:1px solid rgba(90,60,20,0.25); border-left:1px solid rgba(90,60,20,0.18);">
                <div style="font-size:8.5px; letter-spacing:1.5px; text-transform:uppercase; color:#7a1e1e;">Edad</div>
                <div style="font-size:12.5px; color:#2c1f0e;">12 - 14 años</div>
            </div>
        </div>

        <!-- PERSONALIDAD -->
        <div style="margin-top:12px; position:relative; z-index:1;">
            <div style="font-size:8.5px; letter-spacing:1.5px; text-transform:uppercase; color:#7a1e1e; margin-bottom:4px;">Descripción</div>
            <div style="font-size:12px; color:#2c1f0e; font-style:italic; line-height:1.5;">
                Amigo observador que busca alegrar a su familia con pequeños gestos cotidianos como la pesca en el río y la cacería de montaña.
            </div>
        </div>

        <!-- PIE -->
        <div style="text-align:center; margin-top:20px; position:relative; z-index:1;">
            <p style="margin:0; font-size:9px; font-style:italic; color:#7a5c3a; opacity:0.7;">Saga Ruk el Héroe · Archivo Personal Fernando Barra</p>
        </div>
    </div>

</body>
</html>
