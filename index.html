<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgotten Sword</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            background-color: #120c08;
            color: #e8dcc4;
            font-family: 'Lora', Georgia, serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(212, 175, 55, 0.12) 0%, transparent 65%),
                radial-gradient(circle at 50% 80%, rgba(58, 134, 255, 0.05) 0%, transparent 70%);
        }

        .main-container {
            width: 100%;
            max-width: 620px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .saga-title {
            font-family: 'Cinzel', serif;
            font-size: 46px;
            font-weight: 900;
            color: #f5eedc;
            letter-spacing: 3px;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.9), 0 0 25px rgba(212, 175, 55, 0.25);
            margin-bottom: 8px;
        }

        .saga-subtitle {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #d4af37;
            margin-bottom: 25px;
        }

        .divider {
            color: #9e8237;
            font-size: 14px;
            letter-spacing: 12px;
            margin-bottom: 45px;
        }

        /* Contenedor de los dos botones principales */
        .buttons-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 22px;
            margin-bottom: 40px;
        }

        .btn-option {
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: linear-gradient(135deg, #24180e 0%, #170e08 100%);
            border: 2px solid #9e8237;
            border-radius: 12px;
            padding: 22px 28px;
            color: #f5eedc;
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .btn-option:hover {
            transform: translateY(-4px);
            border-color: #d4af37;
            background: linear-gradient(135deg, #322214 0%, #1f130b 100%);
            color: #ffffff;
            box-shadow: 0 12px 35px rgba(212, 175, 55, 0.35);
        }

        .btn-icon {
            font-size: 26px;
        }

        .footer {
            font-family: 'Cinzel', serif;
            font-size: 11.5px;
            color: #a89274;
            opacity: 0.85;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            .saga-title {
                font-size: 34px;
            }
            .btn-option {
                font-size: 17px;
                padding: 18px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="main-container">
        <h1 class="saga-title">Forgotten Sword</h1>
        <p class="saga-subtitle">Selecciona una opción</p>

        <div class="divider">❖ ❖ ❖</div>

        <!-- Los dos botones principales solicitados -->
        <div class="buttons-container">

            <a href="personajes.html" class="btn-option">
                <span class="btn-icon">🛡️</span>
                <span>Fichas de Personajes</span>
            </a>

            <a href="capitulos.html" class="btn-option">
                <span class="btn-icon">📖</span>
                <span>Lista de Capítulos</span>
            </a>

        </div>
    </div>

    <footer class="footer">
        Forgotten Sword © 2026 · Fernando Barra
    </footer>

</body>

</html>
